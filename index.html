<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Habit Tracker</h1>
    <p>Track your habits and stay motivated!</p>

    <form id="habit-form">
        <input
        type="text"
        id="habit-input"
        placeholder="Enter an Habit"
        required>

        <button type="submit" id="submit-button">Add Habit</button>
        



    </form>
    
    <p id="error-message"></p>


    <h2>Your Habits</h2>
    <div id="habits"></div> <!-- This is where the habits will be displayed -->


    

    <script src="script.js"></script>
</body>
</html>
